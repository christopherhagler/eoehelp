name: CI

on:
  pull_request:
  push:
    # development is the working branch, so it is gated too. Without it, CI first
    # runs at the merge to main, which is the wrong place to discover a failure.
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read-only on the cache repository. Only the publish workflow writes.
  packages: read


jobs:
  api:
    name: API — lint, types, tests
    # arm64 end to end: the same architecture as the development machines and as
    # the deployed instance, so nothing is cross-built or emulated anywhere.
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        # Must match POSTGRES_IMAGE in infra/images.env. glibc, not alpine:
        # musl collates by byte, so text ordering and citext folding differ
        # from any glibc build including the deployed one.
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: eoehelp
          POSTGRES_PASSWORD: eoehelp
          POSTGRES_DB: eoehelp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eoehelp"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/container-tooling

      - name: Bootstrap the database
        # The same file the local stack applies through the postgres image's
        # init directory. CI used to carry its own heredoc copy of this, which
        # had drifted to creating the role and nothing else.
        env:
          PGPASSWORD: eoehelp
        run: scripts/db-init.sh localhost 5432

      - uses: ./.github/actions/layer-cache

      - name: Lint, type-check, test, migrations, contract
        # Inside the image that gets tested, which is the premise of ADR 0006:
        # production runs the artifact that passed. Previously CI pip-installed
        # on the runner and the images it built were never executed.
        env:
          TEST_NETWORK: host
          TEST_DATABASE_URL: postgresql+asyncpg://eoehelp:eoehelp@localhost:5432/eoehelp
        run: just ci-api

  web:
    name: Web — format, build, tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/container-tooling

      - uses: ./.github/actions/layer-cache

      - name: Format, test, build, contract types
        run: just ci-web

  images:
    name: Container images (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/container-tooling

      - uses: ./.github/actions/layer-cache

      - name: Build what ships, and assert what it is
        # verify-image.sh asserts the manifest format, the architecture, that
        # the image runs unprivileged, that it carries no test tooling and no
        # tests directory, and that no secret reached its environment.
        # verify-promote.sh proves a digest survives promotion between two
        # throwaway registries, which is the deploy pattern ADR 0006 rests on.
        run: just ci-images

  # Publishing is a job here, not a separate workflow, and it needs the other
  # three. As its own workflow it ran concurrently with CI, so a push whose test
  # suite was red still produced a green publish and a candidate image in the
  # registry — and the image it pushed was a second, independent build of the
  # same source, not the one the images job verified. ADR 0006's rule is that
  # what runs is what was tested; this is what makes that true rather than
  # nearly true.
  publish:
    name: Publish by digest
    needs: [api, web, images]
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/container-tooling

      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
        run: |
          echo "$TOKEN" | skopeo login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin

      - name: Build, verify, and write the layer cache
        # This job rebuilds, and the rebuilt image's digest will not equal the
        # one the `images` job verified — an image config carries its own
        # creation timestamp, so even a complete cache hit produces a different
        # manifest. Digest identity between two jobs is not available without
        # pushing from the job that built it.
        #
        # What makes the published artifact trustworthy is that `ci-images` is
        # the whole gate — build, image assertions, promotion check, then the
        # production-shaped stack under a real request — and this job runs that
        # gate on the very image it then pushes, behind `needs: [api, web,
        # images]`. So the digest published is the digest of an artifact that
        # passed every assertion, on a commit whose other jobs are green.
        #
        # Writing the cache here, once per push to development, is also why the
        # other jobs can read it without racing.
        env:
          BUILD_CACHE_FROM: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ vars.REGISTRY_NAMESPACE || github.repository_owner }}/eoehelp-cache
          BUILD_CACHE_TO: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ vars.REGISTRY_NAMESPACE || github.repository_owner }}/eoehelp-cache
        run: just ci-images

      - name: Publish
        id: push
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
          NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || github.repository_owner }}
        run: |
          set -euo pipefail
          tag="candidate-${GITHUB_SHA::12}"

          api_digest="$(scripts/publish.sh localhost/eoehelp-api:runtime \
            "$REGISTRY/$NAMESPACE/eoehelp-api:$tag")"
          web_digest="$(scripts/publish.sh localhost/eoehelp-web:runtime \
            "$REGISTRY/$NAMESPACE/eoehelp-web:$tag")"

          {
            echo "### Published from a green CI run"
            echo
            echo "| image | digest |"
            echo "|---|---|"
            echo "| \`eoehelp-api:$tag\` | \`$api_digest\` |"
            echo "| \`eoehelp-web:$tag\` | \`$web_digest\` |"
            echo
            echo "Promote with the **Promote** workflow, using these digests."
            echo
            echo "> **On the first publish only:** GHCR creates a package"
            echo "> **public** by default. Set both packages, and the cache"
            echo "> package, to private in their package settings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of the registry
        # The login wrote a token to auth.json on disk; nothing later in this
        # job needs it.
        if: always()
        run: skopeo logout "${{ vars.REGISTRY || 'ghcr.io' }}" || true

  security:
    name: Dependency and code scanning
    # x86: pip-audit and npm audit read advisory databases and build nothing, so
    # the architecture is irrelevant and this runner is the cheaper one.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          # Audit the resolved dependency set rather than the environment. eoehelp-api
          # is installed editable and has no PyPI entry, and --strict fails on both
          # "not found" and "skipped" — so --skip-editable does not rescue it. Freezing
          # without editables hands pip-audit exactly the third-party closure, which
          # keeps --strict meaning what it should: a resolution failure fails the job.
          #
          # The freeze happens before pip-audit is installed, so its own dependency
          # tree is not dragged into the audit surface.
          pip install -e .
          pip freeze --exclude-editable > /tmp/requirements.txt
          pip install pip-audit
          pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Node dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high
