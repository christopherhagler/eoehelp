[project]
name = "eoehelp-api"
version = "0.1.0"
description = "eoehelp.org — EoE symptom tracking and clinical reporting API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    # Server-side calls to Open Food Facts and USDA FoodData Central. The browser
    # never calls them directly, so neither learns which patient is asking.
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2",
    "structlog>=24.4",
    "aiosmtplib>=3.0",
    "slowapi>=0.1.9",
    # RRULE expansion for the adherence denominator. types-python-dateutil was
    # already in dev deps in anticipation of this.
    "python-dateutil>=2.9",
    # Declared rather than relying on the base image shipping /usr/share/zoneinfo.
    # The patient's timezone decides which day an entry belongs to, so a slimmer
    # base layer silently breaking zone lookups would corrupt data rather than
    # fail loudly.
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Linters are CI gates, so they are pinned exactly: a new release that adds a
    # rule turns an untouched main branch red, which is a failure of the pipeline
    # rather than of the code. Bumping these is a deliberate, reviewed change.
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Present only inside the container image, where the package is also installed
# as a wheel. Linting it double-reports every finding against a stale copy.
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["slowapi.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The container runs tests as an unprivileged user with a read-only app directory.
cache_dir = "/tmp/pytest_cache"

[tool.coverage.run]
source = ["src/eoehelp_api"]
omit = ["*/alembic/*"]
# SQLAlchemy's async API runs the sync database work inside greenlets, and the
# Python trace function is per-greenlet. Without declaring this, every line after
# the first `await session.execute(...)` in a coroutine reads as uncovered, which
# understated real coverage by roughly fifteen points and would have made the
# thresholds the plan wants to enforce in CI meaningless.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# Plan M0: scoring, repositories, and auth carry the strictest thresholds because
# silent wrongness there is either a clinical error or a cross-patient data leak.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
