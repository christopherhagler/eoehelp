server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CloudFront terminates TLS and sets HSTS in front of this; these are the
    # headers the origin must guarantee regardless of what sits ahead of it.
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Hashed build artefacts are content-addressed and safe to cache forever.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA shell. no-store rather than no-cache because this same document is
    # served for routes that render health data, and `try_files` from any route
    # lands here — so this block's headers are the ones that actually apply.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
