# Included explicitly by EVERY location block.
#
# nginx does not inherit add_header into a block that declares its own: one
# `add_header Cache-Control ...` in a location silently drops every header set
# on the server. Repeating the include is deliberate — it is the only way to
# guarantee these are present on every response.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

# The SPA shell is served for every route, including ones that render health
# data, so the safe default is not to index it. Marketing pages become
# indexable when they are prerendered and can carry their own directive.
add_header X-Robots-Tag "noindex, nofollow" always;
