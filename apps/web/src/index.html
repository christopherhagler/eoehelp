<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>eoehelp — track your EoE, and give your doctor the full picture</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A personal health record for eosinophilic esophagitis. Track symptoms, elimination diets, and endoscopy results, then share a clear summary with your gastroenterologist."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a1c20" />
    <!-- Authenticated pages carry health data; keep them out of search indexes.
       Marketing routes are opened up explicitly via robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="any" />

    <!-- TODO: self-host these before launch. Google Fonts is a third-party request
       on authenticated pages, and while a font request carries no PHI, removing
       the dependency simplifies both the CSP and the subprocessor register. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Sora:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
