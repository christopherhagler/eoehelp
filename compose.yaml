# Base image tags come from infra/images.env and have no inline default: a
# missing variable must fail loudly rather than quietly selecting a different
# Postgres from the one CI and the deployed stack use. Run through `just`, which
# passes --env-file, or pass it yourself.
#
# Local development stack, run with Podman. Images are built by
# scripts/build-images.sh and referenced by tag here — there are deliberately no
# `build:` keys, so `just up` cannot silently rebuild an image that is already
# correct, and cannot silently run one that is stale.
#
# Local development stack, run with Podman. Everything runs in containers, so a
# developer needs only `podman` and nothing else installed. The api/web images
# here are the same ones CI builds and ECS runs; only the command and mounts differ.
#
#   just up
#   just migrate
#
# Mailhog captures magic-link emails at http://localhost:8025 so no mail ever
# leaves the machine in development.
#
# Note: /docker-entrypoint-initdb.d below is a path inside the upstream postgres
# image, not a runtime dependency — it is named that way by the image author.

name: eoehelp

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set in infra/images.env}
    environment:
      POSTGRES_USER: eoehelp
      POSTGRES_PASSWORD: eoehelp
      POSTGRES_DB: eoehelp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_glibc:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eoehelp -d eoehelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:?set in infra/images.env}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: ${MAILHOG_IMAGE:?set in infra/images.env}
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    logging:
      driver: none

  # Migrations run once, before the API starts, as their own service. Previously
  # they were the first half of the API's command, which meant a failed
  # migration surfaced as a container that restarted forever with the real error
  # scrolled away. The deployed shape runs them as a separate task too.
  migrate:
    image: ${API_DEV_IMAGE:-localhost/eoehelp-api:dev}
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      PYTHONPATH: /app/src
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://eoehelp:eoehelp@postgres:5432/eoehelp
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./apps/api/alembic:/app/alembic:ro
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_DEV_IMAGE:-localhost/eoehelp-api:dev}
    pull_policy: never
    environment:
      # Makes the mounted source take precedence over the copy pip-installed into
      # the image, so edits reload. Deployed images set no PYTHONPATH and run the
      # installed package.
      PYTHONPATH: /app/src
      ENVIRONMENT: local
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://eoehelp:eoehelp@postgres:5432/eoehelp
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      APP_BASE_URL: http://localhost:4200
      API_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      # Source mount for reload. Deployed images copy source in and mount nothing.
      - ./apps/api/src:/app/src:ro
      - ./apps/api/alembic:/app/alembic:ro
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_DEPS_IMAGE:-localhost/eoehelp-web:deps}
    pull_policy: never
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000"]
    ports:
      - "4200:4200"
    volumes:
      # Only src and public. node_modules lives in the image, where a dependency
      # change rebuilds it; the named volume that used to hold it was a snapshot
      # taken once and never updated, which is how the dev server ended up
      # running against dependencies from weeks earlier.
      - ./apps/web/src:/build/src
      - ./apps/web/public:/build/public
    depends_on:
      - api

volumes:
  # Renamed when the image moved from musl to glibc. A glibc server starts
  # happily on a musl-created directory and says nothing — musl records no
  # collation version, so PostgreSQL's own mismatch check cannot fire — while
  # every text index is ordered by musl bytes and read by glibc rules. Measured
  # on such a directory: an index scan and a sequential scan returned different
  # answers for the same query, a row was invisible to an index lookup, and a
  # duplicate primary key was accepted. Renaming forces a fresh directory and
  # leaves the old one intact if anyone wants it back.
  postgres_data_glibc:
